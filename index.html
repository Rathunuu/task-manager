<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         LOGIN / REGISTER SCREEN
    ========================== -->

    <div id="authScreen" class="auth-screen">

        <div class="auth-card">

            <h1>Task Manager</h1>
            <p>Login or create an account to continue.</p>

            <div class="input-group">
                <label for="authUsername">Username</label>
                <input type="text" id="authUsername" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="authPassword">Password</label>
                <input type="password" id="authPassword" autocomplete="off">
            </div>

            <p id="authError" class="auth-error" hidden></p>

            <div class="auth-actions">
                <button id="loginBtn" class="primary-btn" type="button">Login</button>
                <button id="registerBtn" class="secondary-btn" type="button">Register</button>
            </div>

        </div>

    </div>


    <div class="app-container" id="appContainer" hidden>

        <!-- =========================
             HEADER
        ========================== -->

        <header class="app-header">

            <div>
                <span class="eyebrow">PRODUCTIVITY</span>

                <h1>Task Manager</h1>

                <p>
                    Organize your work. Stay focused.
                </p>
            </div>

            <div class="task-count">

                <span id="taskCount">0</span>

                <small>Tasks</small>

            </div>

            <button
                id="logoutBtn"
                class="secondary-btn"
                type="button"
                style="margin-left: 10px;"
            >
                Logout (<span id="currentUserLabel"></span>)
            </button>

        </header>


        <!-- =========================
             PROJECT SWITCHER
        ========================== -->

        <section class="projects-card">

            <div class="section-heading">

                <div>
                    <span class="eyebrow">PROJECTS</span>

                    <h2>Your Projects</h2>

                    <p>
                        Switch between projects and manage their tasks.
                    </p>
                </div>

                <button
                    id="newProjectBtn"
                    class="secondary-btn"
                    type="button"
                >
                    + New Project
                </button>

            </div>


            <div
                id="projectSwitcher"
                class="project-switcher"
            >
                <!-- Projects will be rendered here by JavaScript -->
            </div>

        </section>


        <!-- =========================
             PROJECT PROGRESS
        ========================== -->

        <section class="progress-card">

            <div class="progress-header">

                <div>
                    <span class="eyebrow">PROJECT PROGRESS</span>

                    <h3 id="activeProjectName">
                        Current Project
                    </h3>
                </div>

                <strong id="progressText">
                    0 of 0 tasks done
                </strong>

            </div>


            <div
                class="progress-bar"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
                id="progressBar"
            >
                <div
                    id="progressFill"
                    class="progress-fill"
                ></div>
            </div>

        </section>


        <!-- =========================
             ADD TASK
        ========================== -->

        <section class="add-task-card">

            <div class="input-group">

                <label for="taskInput">
                    New task
                </label>

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                >

            </div>


            <div class="input-group category-group">

                <label for="categorySelect">
                    Category
                </label>

                <select id="categorySelect">

                    <option value="Work">
                        Work
                    </option>

                    <option value="Personal">
                        Personal
                    </option>

                    <option value="Urgent">
                        Urgent
                    </option>

                </select>

            </div>


            <!-- Week 3 Status -->

            <div class="input-group">

                <label for="statusSelect">
                    Status
                </label>

                <select id="statusSelect">

                    <option value="To Do">
                        To Do
                    </option>

                    <option value="In Progress">
                        In Progress
                    </option>

                    <option value="In Review">
                        In Review
                    </option>

                    <option value="Done">
                        Done
                    </option>

                </select>

            </div>


            <button
                id="addTaskBtn"
                class="primary-btn"
                type="button"
            >

                <span>+</span>

                Add Task

            </button>

        </section>


        <!-- =========================
             SEARCH + FILTERS + VIEW
        ========================== -->

        <section class="controls-card">

            <!-- Search -->

            <div class="search-box">

                <span
                    class="search-icon"
                    aria-hidden="true"
                >
                    ⌕
                </span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search tasks..."
                    autocomplete="off"
                >

            </div>


            <!-- Category Filters -->

            <div
                class="filter-row"
                id="categoryFilters"
            >

                <button
                    class="filter-btn active"
                    data-category="All"
                    type="button"
                >
                    All
                </button>

                <button
                    class="filter-btn"
                    data-category="Work"
                    type="button"
                >
                    Work
                </button>

                <button
                    class="filter-btn"
                    data-category="Personal"
                    type="button"
                >
                    Personal
                </button>

                <button
                    class="filter-btn"
                    data-category="Urgent"
                    type="button"
                >
                    Urgent
                </button>
